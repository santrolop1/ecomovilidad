[project]
name = "ecomovilidad-api"
version = "0.1.0"
description = "API de EcoMovilidad: catálogo, inventario, carrito, pedidos y alquiler."
requires-python = ">=3.13,<3.14"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "email-validator>=2.3.0",
    "fastapi>=0.115",
    "fpdf2>=2.8.9",
    "geoalchemy2>=0.20.0",
    "psycopg[binary]>=3.2",
    "pydantic-settings>=2.15.0",
    "sqlalchemy>=2.0",
    "tzdata>=2026.5",
    "uvicorn[standard]>=0.54.0",
]

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.ruff.lint.per-file-ignores]
"alembic/versions/*" = ["E501"]
