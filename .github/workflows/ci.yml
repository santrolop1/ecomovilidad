name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - name: Crear clave temporal de PostgreSQL
        working-directory: .
        run: |
          password="$(openssl rand -hex 24)"
          echo "::add-mask::$password"
          echo "POSTGRES_PASSWORD=$password" > .env
          echo "DATABASE_URL=postgresql+psycopg://ecomovilidad:$password@localhost:5433/ecomovilidad" >> "$GITHUB_ENV"
      - name: Levantar PostgreSQL + PostGIS
        working-directory: .
        run: docker compose up -d --wait db
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run alembic upgrade head
      - run: uv run alembic check
      - run: uv run pytest

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Revisar todo el historial
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.24.0 git /repo --redact --no-banner
