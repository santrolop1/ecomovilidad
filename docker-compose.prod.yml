# Producción en un solo servidor: docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
# Solo Caddy expone puertos. Guía completa en docs/DESPLIEGUE.md.
name: ecomovilidad-prod

x-api-env: &api-env
  DATABASE_URL: postgresql+psycopg://ecomovilidad:${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}@db:5432/ecomovilidad
  ENVIRONMENT: production
  COOKIE_SECURE: "true"
  FRONTEND_URL: https://${DOMAIN:?Define DOMAIN}${PUBLIC_PORT_SUFFIX:-}
  CORS_ORIGINS: '["https://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}"]'
  TRUSTED_PROXIES: '["172.16.0.0/12","10.0.0.0/8"]'
  PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-manual}
  PAYMENT_INSTRUCTIONS: ${PAYMENT_INSTRUCTIONS:-}
  PAYMENT_WINDOW_MINUTES: ${PAYMENT_WINDOW_MINUTES:-1440}
  WOMPI_PUBLIC_KEY: ${WOMPI_PUBLIC_KEY:-}
  WOMPI_PRIVATE_KEY: ${WOMPI_PRIVATE_KEY:-}
  WOMPI_EVENTS_SECRET: ${WOMPI_EVENTS_SECRET:-}
  WOMPI_INTEGRITY_SECRET: ${WOMPI_INTEGRITY_SECRET:-}
  WOMPI_API_URL: ${WOMPI_API_URL:-https://production.wompi.co/v1}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_FROM: ${SMTP_FROM:-}
  COMPANY_NIT: ${COMPANY_NIT:-}
  GPS_RETENTION_DAYS: ${GPS_RETENTION_DAYS:-90}
  INVOICE_PREFIX: ${INVOICE_PREFIX:-EMV}

services:
  db:
    build:
      context: ./backend/docker
      dockerfile: db.Dockerfile
    image: ecomovilidad-db:16-postgis3
    restart: unless-stopped
    environment:
      POSTGRES_DB: ecomovilidad
      POSTGRES_USER: ecomovilidad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Define POSTGRES_PASSWORD}
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ecomovilidad -d ecomovilidad"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build: ./backend
    image: ecomovilidad-api:prod
    restart: unless-stopped
    environment:
      <<: *api-env
      SEED_DEMO: ${SEED_DEMO:-false}
    depends_on:
      db:
        condition: service_healthy
    # No arranca si la configuración no es apta para producción.
    command: >
      sh -c 'python -m app.cli check-production &&
      alembic upgrade head &&
      if [ "$$SEED_DEMO" = "true" ]; then python -m app.db.seed; fi &&
      exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers --forwarded-allow-ips="*"'
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    image: ecomovilidad-web:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      API_MODE: real
      API_BASE_URL: http://api:8000/api/v1
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}${PUBLIC_PORT_SUFFIX:-}
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 180s

  caddy:
    image: caddy:2.8-alpine
    restart: unless-stopped
    environment:
      DOMAIN: ${DOMAIN}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      web:
        condition: service_healthy

  # Vence reservas y pagos, y limpia datos viejos cada 5 minutos.
  worker:
    image: ecomovilidad-api:prod
    restart: unless-stopped
    environment: *api-env
    depends_on:
      api:
        condition: service_healthy
    command: sh -c 'while true; do python -m app.cli housekeeping; sleep 300; done'

  # Copia diaria de la base de datos; conserva 14 días.
  backup:
    image: ecomovilidad-db:16-postgis3
    restart: unless-stopped
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ${BACKUP_DIR:-./backups}:/backups
    depends_on:
      api:
        condition: service_healthy
    entrypoint: >
      sh -c 'while true; do
      pg_dump -h db -U ecomovilidad -Fc ecomovilidad -f /backups/ecomovilidad-$$(date +%Y%m%d-%H%M%S).dump &&
      find /backups -name "*.dump" -mtime +14 -delete;
      sleep 86400; done'

volumes:
  db-data:
  caddy-data:
  caddy-config:
